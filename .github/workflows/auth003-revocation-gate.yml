name: AUTH-003 revocation gate

on:
  push:
    paths:
      - ".github/workflows/auth003-revocation-gate.yml"
      - "scripts/spikes/better-auth-sdk-v2/**"
  pull_request:
    paths:
      - ".github/workflows/auth003-revocation-gate.yml"
      - "scripts/spikes/better-auth-sdk-v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opaque-family-revocation:
    # Deliberately red while the provider cannot satisfy AUTH-003. Do not use
    # continue-on-error or invert the probe's exit status to make this green.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.23.4, 24.22.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scripts/spikes/better-auth-sdk-v2/package-lock.json
      - run: npm ci --prefix scripts/spikes/better-auth-sdk-v2
      - run: node --check scripts/spikes/better-auth-sdk-v2/lifecycle-revocation.mjs
      - run: npm --prefix scripts/spikes/better-auth-sdk-v2 run probe:opaque-local
